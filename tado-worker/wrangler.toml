# Alleen nodig als je via de command line uitrolt (npx wrangler deploy).
# Via het Cloudflare-dashboard kun je dit bestand negeren; zie README.md.
name = "keuken-tado"
main = "worker.js"
compatibility_date = "2026-09-01"

[triggers]
# Elke 5 minuten = 288 Tado-verzoeken per dag (dit account heeft een limiet van ±1000).
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "TADO_KV"
id = "VUL_HIER_HET_KV_ID_IN"
